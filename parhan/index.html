<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پڑھن — reading archive</title>
<style>
  :root {
    --bg: #fbfaf8;
    --fg: #1c1a17;
    --muted: #6b6459;
    --border: #e4e0d8;
    --accent: #8a4a2f;
    --chip-bg: #f0ece3;
    --chip-active-bg: #8a4a2f;
    --chip-active-fg: #fbfaf8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171512;
      --fg: #eae6df;
      --muted: #9a9184;
      --border: #332e28;
      --accent: #d99a72;
      --chip-bg: #241f1a;
      --chip-active-bg: #d99a72;
      --chip-active-fg: #171512;
    }
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    max-width: 860px;
    margin: 0 auto;
    padding: 2.5rem 1.25rem 5rem;
    line-height: 1.5;
  }
  h1 {
    font-size: 1.6rem;
    margin: 0 0 0.25rem;
  }
  .subtitle {
    color: var(--muted);
    font-size: 0.95rem;
    margin: 0 0 1.75rem;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    align-items: center;
    margin-bottom: 1.75rem;
    padding-bottom: 1.25rem;
    border-bottom: 1px solid var(--border);
  }
  input[type="search"] {
    flex: 1 1 200px;
    padding: 0.45rem 0.7rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--fg);
    font-size: 0.9rem;
  }
  .chip {
    border: 1px solid var(--border);
    background: var(--chip-bg);
    color: var(--fg);
    border-radius: 999px;
    padding: 0.3rem 0.75rem;
    font-size: 0.82rem;
    cursor: pointer;
    user-select: none;
  }
  .chip.active {
    background: var(--chip-active-bg);
    color: var(--chip-active-fg);
    border-color: var(--chip-active-bg);
  }
  .count {
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 1rem;
  }
  ul.entries {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .entry {
    padding: 0.9rem 0;
    border-bottom: 1px solid var(--border);
    display: grid;
    grid-template-columns: 5.5rem 1fr auto;
    gap: 0.75rem;
    align-items: baseline;
  }
  .entry .date {
    color: var(--muted);
    font-size: 0.8rem;
    white-space: nowrap;
  }
  .entry .main a {
    color: var(--fg);
    text-decoration: none;
    font-weight: 600;
  }
  .entry .main a:hover {
    color: var(--accent);
    text-decoration: underline;
  }
  .entry .author {
    color: var(--muted);
    font-size: 0.88rem;
  }
  .entry .tags {
    font-size: 0.78rem;
    color: var(--muted);
    margin-top: 0.15rem;
  }
  .entry .format {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--accent);
    white-space: nowrap;
    text-align: right;
  }
  .empty {
    color: var(--muted);
    padding: 2rem 0;
    text-align: center;
  }
  @media (max-width: 560px) {
    .entry { grid-template-columns: 1fr auto; }
    .entry .date { grid-column: 1 / -1; order: -1; }
  }
</style>
</head>
<body>
  <h1 dir="auto">پڑھن</h1>
  <p class="subtitle">Essays, books, movies, and videos, logged as I go through them.</p>

  <div class="controls">
    <input type="search" id="search" placeholder="Search title or author…">
    <span class="chip active" data-format="all">All</span>
    <span class="chip" data-format="essay">Essays</span>
    <span class="chip" data-format="book">Books</span>
    <span class="chip" data-format="movie">Movies</span>
    <span class="chip" data-format="youtube">Videos</span>
    <span class="chip" data-format="other">Other</span>
  </div>

  <div class="count" id="count"></div>
  <ul class="entries" id="entries"></ul>
  <div class="empty" id="empty" style="display:none;">Nothing matches.</div>

  <script>
    let ALL = [];
    let activeFormat = "all";
    let activeTag = null;

    const entriesEl = document.getElementById("entries");
    const countEl = document.getElementById("count");
    const emptyEl = document.getElementById("empty");
    const searchEl = document.getElementById("search");

    function render() {
      const q = searchEl.value.trim().toLowerCase();
      const filtered = ALL.filter(e => {
        if (activeFormat !== "all" && e.format !== activeFormat) return false;
        if (activeTag && !e.tags.includes(activeTag)) return false;
        if (q && !(e.title.toLowerCase().includes(q) || e.author.toLowerCase().includes(q))) return false;
        return true;
      });

      countEl.textContent = `${filtered.length} of ${ALL.length}`;
      entriesEl.innerHTML = "";
      emptyEl.style.display = filtered.length ? "none" : "block";

      for (const e of filtered) {
        const li = document.createElement("li");
        li.className = "entry";

        const date = document.createElement("span");
        date.className = "date";
        date.textContent = e.date;

        const main = document.createElement("div");
        main.className = "main";
        const link = document.createElement("a");
        link.href = e.url || "#";
        link.textContent = e.title;
        link.target = "_blank";
        link.rel = "noopener";
        link.dir = "auto";
        main.appendChild(link);

        if (e.author) {
          const author = document.createElement("div");
          author.className = "author";
          author.dir = "auto";
          author.textContent = e.author;
          main.appendChild(author);
        }

        if (e.tags.length) {
          const tags = document.createElement("div");
          tags.className = "tags";
          tags.innerHTML = e.tags.map(t =>
            `<span class="tag-link" data-tag="${t}" style="cursor:pointer;text-decoration:underline dotted;">#${t}</span>`
          ).join(" ");
          main.appendChild(tags);
        }

        const format = document.createElement("span");
        format.className = "format";
        format.textContent = e.format;

        li.append(date, main, format);
        entriesEl.appendChild(li);
      }

      entriesEl.querySelectorAll(".tag-link").forEach(el => {
        el.addEventListener("click", () => {
          activeTag = activeTag === el.dataset.tag ? null : el.dataset.tag;
          render();
        });
      });
    }

    document.querySelectorAll(".chip").forEach(chip => {
      chip.addEventListener("click", () => {
        document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
        chip.classList.add("active");
        activeFormat = chip.dataset.format;
        render();
      });
    });

    searchEl.addEventListener("input", render);

    fetch("data.json")
      .then(r => r.json())
      .then(data => { ALL = data; render(); })
      .catch(() => {
        countEl.textContent = "";
        emptyEl.textContent = "Couldn't load data.json.";
        emptyEl.style.display = "block";
      });
  </script>
</body>
</html>
